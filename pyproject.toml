[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "intnan"
description = "Function collection for handling integers with NaNs."
dynamic = ["version"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Michael Löffler", email = "ml@occam.com.ua"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
keywords = ["integer", "nan", "missing values", "intnan"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.4"]

[dependency-groups]
dev = [
    "pytest",
    "numba",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
source = "https://github.com/ml31415/intnan"
tracker = "https://github.com/ml31415/intnan/issues"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-exports via star import from the package namespace
"intnan/__init__.py" = ["F403"]
"intnan/intnan_numba.py" = ["F401"]

[tool.mypy]
# numpy's bundled stubs use PEP 695 syntax, so mypy needs python_version >= 3.12
python_version = "3.12"
files = ["intnan"]

[[tool.mypy.overrides]]
module = "numba.*"
# Numba's bundled type hints are incomplete (e.g. prange not marked as iterable)
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "setuptools_scm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "intnan.tests.*"
# Dynamic import fallbacks at the top of the test suite
disable_error_code = ["no-redef", "assignment"]

[tool.setuptools.packages.find]
include = ["intnan*"]

[tool.setuptools_scm]
write_to = "intnan/_version.py"
