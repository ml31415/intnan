[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "intnan"
description = "Function collection for handling integers with NaNs."
dynamic = ["version"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Michael Löffler", email = "ml@occam.com.ua"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
keywords = ["integer", "nan", "missing values", "intnan"]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = [
    "pytest",
    "numba",
    "ruff",
]

[project.urls]
source = "https://github.com/ml31415/intnan"
tracker = "https://github.com/ml31415/intnan/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Re-exports via star import from the package namespace
"intnan/__init__.py" = ["F403"]
"intnan/intnan_numba.py" = ["F401"]

[tool.setuptools.packages.find]
include = ["intnan*"]

[tool.setuptools_scm]
write_to = "intnan/_version.py"
